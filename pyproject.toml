[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celltyping"
version = "0.1.0"
description = "Ontology-driven hierarchical cell typing for imaging-based spatial transcriptomics (Xenium, CosMx)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "scanpy>=1.10",
  "anndata>=0.10",
  "networkx",
  "obonet",
  "SPARQLWrapper",
  "requests",
  "openpyxl",
  "pyyaml",
  "typer",
  "rich",
  "pyarrow",
  "h5py",
  "matplotlib",
]

[project.optional-dependencies]
spatial = ["squidpy", "spatialdata", "spatialdata-io"]
scoring = ["decoupler>=1.6,<2"]
census = ["cellxgene-census>=1.17,<2"]
dev = ["pytest"]

[project.scripts]
celltyping = "celltyping.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
