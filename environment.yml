name: celltyping
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy<2.3
  - pandas
  - scipy
  - scikit-learn
  - scanpy>=1.10
  - anndata>=0.10
  - leidenalg
  - python-igraph
  - squidpy
  - networkx
  - obonet
  - sparqlwrapper
  - requests
  - openpyxl
  - pyyaml
  - typer
  - rich
  - pyarrow
  - h5py
  - matplotlib
  - seaborn
  - pytest
  - jupyterlab
  - ipykernel
  - pip:
      - spatialdata>=0.2
      - spatialdata-io>=0.1.5
      - decoupler>=1.6,<2
      - cellxgene-census>=1.17,<2
